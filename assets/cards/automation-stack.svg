<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="title desc">
  <title id="title">Self-hosted automation stack</title>
  <desc id="desc">One VPS running n8n, a LangGraph agent API, Postgres, Redis and a CDN. A Telegram bot runs Claude Code on it from my phone.</desc>
  <defs>
    
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8B4FE"/>
    <stop offset=".55" stop-color="#C084FC"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C084FC" stop-opacity=".8"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="600" height="230" rx="18"/></clipPath>
  </defs>

  <rect width="600" height="230" rx="18" fill="#0A0A0B"/>
  <g clip-path="url(#card)">
    <circle cx="580" cy="-10" r="240" fill="url(#glow)">
      <animate attributeName="opacity" values="1;.55;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="-200" y="0" width="200" height="1.5" fill="url(#sheen)">
      <animate attributeName="x" values="-200;600" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".75" y=".75" width="598.5" height="228.5" rx="17.25" fill="none" stroke="#26262D" stroke-width="1.5"/>

  <text x="28" y="42" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#C084FC">infra</text>
  
    <rect x="445" y="24" width="131" height="26" rx="13" fill="#111114" stroke="#26262D"/>
    <circle cx="459" cy="37" r="3.5" fill="#C084FC">
        <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    <text x="470" y="41.32" textLength="95" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#C084FC">in production</text>
  <text x="28" y="84" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-.4" fill="#FFFFFF">Self-hosted automation stack</text>
  <text x="28" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9CA3AF">One VPS running n8n, a LangGraph agent API, Postgres, Redis and a CDN.</text>
  <text x="28" y="136" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9CA3AF">A Telegram bot runs Claude Code on it from my phone.</text>
  
    <rect x="28" y="180" width="66" height="26" rx="13" fill="#16161B" stroke="#26262D"/>
    
    <text x="39" y="197.32" textLength="44" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#D8B4FE">Docker</text>
    <rect x="102" y="180" width="44" height="26" rx="13" fill="#16161B" stroke="#26262D"/>
    
    <text x="113" y="197.32" textLength="22" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#D8B4FE">n8n</text>
    <rect x="154" y="180" width="88" height="26" rx="13" fill="#16161B" stroke="#26262D"/>
    
    <text x="165" y="197.32" textLength="66" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#D8B4FE">LangGraph</text>
    <rect x="250" y="180" width="59" height="26" rx="13" fill="#16161B" stroke="#26262D"/>
    
    <text x="261" y="197.32" textLength="37" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#D8B4FE">Caddy</text>
</svg>
