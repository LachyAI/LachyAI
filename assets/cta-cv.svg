<svg xmlns="http://www.w3.org/2000/svg" width="390" height="78" viewBox="0 0 390 78" role="img" aria-label="Read the receipts: my CV, every claim with evidence">
  <defs>
    
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8B4FE"/>
    <stop offset=".55" stop-color="#C084FC"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="btn"><rect x="1" y="1" width="388" height="76" rx="15"/></clipPath>
  </defs>
  <rect x="1" y="1" width="388" height="76" rx="15" fill="url(#ink)" stroke="none" stroke-opacity=".7" stroke-width="1.5"/>
  <g clip-path="url(#btn)">
    <rect x="-140" y="0" width="120" height="78" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-140;450;450" keyTimes="0;.45;1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="24" y="35" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0A0A0B">Read the receipts</text>
  <text x="24" y="57" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#3B1566">my CV, every claim with evidence</text>
  <text x="346" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0B">→
    <animate attributeName="x" values="346;352;346" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>
