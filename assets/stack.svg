<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">The stack behind it</title>
  <desc id="desc">A self-hosted VPS running Caddy, n8n, LangGraph, Postgres, Redis, Umami, Omi webhook, Dozzle, Diun. Claude Code, headless · 29 cron jobs. Inputs: phone, webhooks, cloudflare. Connected to vercel, neon + supabase, anthropic api, slack.</desc>
  <defs>
    
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8B4FE"/>
    <stop offset=".55" stop-color="#C084FC"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="480" rx="18"/></clipPath>
  </defs>
  <style>
    .s { animation: pop .5s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect width="1200" height="480" rx="18" fill="#0A0A0B"/>
