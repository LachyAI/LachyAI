name: profile

# Rebuilds the generated parts of the profile: the activity card and the snake go to the
# `output` branch, and the ~/writing list in README.md is refreshed from the lachlancb.me feed.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activity card
        run: node scripts/activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#7C3AED&color_dots=#EDEDF0,#E9D5FF,#D8B4FE,#C084FC,#9333EA
            dist/snake-dark.svg?color_snake=#C084FC&color_dots=#16161B,#3B1F5C,#5B2E91,#8B4FD1,#C084FC

      - name: Publish images to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh the writing list
        run: node scripts/writing.mjs

      - name: Commit README if the list changed
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh writing list" README.md
          git push
